<html>
<head>
  <meta charset="UTF-8">
  <script>
    // Save the path to sessionStorage and redirect to root.
    // index.html will restore the path so Flutter can route correctly.
    sessionStorage.setItem('redirect', location.href);
  </script>
  <meta http-equiv="refresh" content="0;URL='/'">
</head>

</html>
